<!DOCTYPE html>
<html class="h-full bg-slate-100" lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración de Avisos - ISBO</title>
  <link rel="icon" type="image/jpeg" href="logo-isbo.jpg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00489A">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Iconos Material y Fuente Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-[#F1F5F9] font-sans text-slate-800 antialiased flex flex-col">

  <!-- ========================================================================= -->
  <!-- 0. PANTALLA DE ACCESO ADMINISTRATIVO (LOGIN INSTITUCIONAL)                -->
  <!--    Único elemento visible en el DOM mientras no haya sesión activa.       -->
  <!-- ========================================================================= -->
  <div id="auth-root" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl border-2 border-slate-200 max-w-md w-full p-7 sm:p-9 relative">
      <div class="text-center mb-6">
        <img src="logo-isbo.jpg" alt="Logo ISBO" class="h-16 w-16 mx-auto rounded-2xl object-contain shadow-md border-2 border-[#00489A]/20 bg-[#00489A] mb-3">
        <h2 class="text-xl font-black text-slate-900 tracking-tight">Acceso Administrativo</h2>
        <p class="text-xs text-slate-500 mt-1">Gestión de Avisos y Cartelera · ISBO</p>
      </div>

      <form id="form-login" class="space-y-4">
        <div>
          <label for="login-usuario" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
            Usuario
          </label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">person</span>
            <input type="text" id="login-usuario" autocomplete="username" required placeholder="adminisbo o isboadmin" class="w-full pl-9 pr-4 py-2.5 rounded-xl border-2 border-slate-200 text-sm font-medium focus:border-sky-500 focus:outline-none transition-colors text-slate-900 bg-slate-50/70">
          </div>
        </div>

        <div>
          <label for="login-password" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
            Contraseña
          </label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">lock</span>
            <input type="password" id="login-password" autocomplete="current-password" required placeholder="••••••••" class="w-full pl-9 pr-4 py-2.5 rounded-xl border-2 border-slate-200 text-sm font-medium focus:border-sky-500 focus:outline-none transition-colors text-slate-900 bg-slate-50/70">
          </div>
        </div>

        <div id="login-error" class="hidden p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs font-bold flex items-center gap-2">
          <span class="material-symbols-outlined text-base shrink-0">error</span>
          <span>Usuario o contraseña incorrectos.</span>
        </div>

        <button type="submit" class="w-full py-3 px-4 rounded-xl bg-[#00489A] hover:bg-[#003878] text-white font-extrabold text-sm shadow-md transition-all flex items-center justify-center gap-2 cursor-pointer mt-2">
          <span class="material-symbols-outlined text-lg">login</span>
          <span>Ingresar al Panel</span>
        </button>

        <div class="pt-3 text-center border-t border-slate-100">
          <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-bold text-sky-700 hover:text-sky-900 transition-colors">
            <span class="material-symbols-outlined text-sm">arrow_back</span>
            <span>Volver a la Pantalla de Inasistencias</span>
          </a>
        </div>
      </form>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- 1. CONTENEDOR ACTIVO DEL PANEL ADMINISTRATIVO (Vacío por seguridad)       -->
  <!-- ========================================================================= -->
  <div id="admin-root" class="hidden min-h-screen flex flex-col justify-between"></div>

  <!-- ========================================================================= -->
  <!-- 2. PLANTILLA PROTEGIDA DEL PANEL ADMINISTRATIVO                           -->
  <!--    Inerte en el DOM: Solo se clona tras validar la sesión con éxito.      -->
  <!-- ========================================================================= -->
  <template id="template-panel-admin">

  <!-- ========================================================================= -->
  <!-- ENCABEZADO SUPERIOR: PANEL DE ADMINISTRACIÓN DE AVISOS                    -->
  <!-- ========================================================================= -->
  <header class="bg-[#00489A] text-white border-b-2 border-[#F8E124] shadow-md shrink-0 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 py-2.5 flex items-center justify-between gap-4">
      
      <!-- Logo y Título Oficial -->
      <div class="flex items-center gap-3">
        <img src="logo-isbo.jpg" alt="Logo ISBO" class="h-9 w-9 rounded-lg object-contain shadow-sm border border-white/20 bg-[#00489A]">
        <div>
          <div class="flex items-center gap-2">
            <span class="text-lg sm:text-xl font-black text-white">Panel de Administración de Avisos</span>
            <span class="px-2 py-0.5 rounded text-[10px] font-black uppercase tracking-wider bg-black/20 text-[#F8E124] border border-[#F8E124]/30 hidden sm:inline">Administrativos y Adscriptos</span>
          </div>
          <p class="text-[11px] text-sky-100">ISBO · Instituto Superior Brazo Oriental</p>
        </div>
      </div>

      <!-- Acciones de Cabecera -->
      <div class="flex items-center gap-2.5">
        <a href="index.html" target="_blank" class="flex items-center gap-2 px-3.5 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs shadow-md transition-all" title="Abrir la Pantalla de Inasistencias en una nueva pestaña">
          <span class="material-symbols-outlined text-base">tv</span>
          <span class="hidden sm:inline">Ver Pantalla de Inasistencias</span>
        </a>

        <button type="button" id="btn-logout" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-red-600/80 hover:bg-red-600 text-white font-bold text-xs transition-all cursor-pointer border border-red-400/30" title="Cerrar sesión de administración">
          <span class="material-symbols-outlined text-base">logout</span>
          <span class="hidden sm:inline">Cerrar Sesión</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ========================================================================= -->
  <!-- 2. CONTENIDO PRINCIPAL: Formulario + Vista Previa + Avisos Activos        -->
  <!-- ========================================================================= -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-6 md:p-8">
    
    <!-- Banner Descriptivo -->
    <div class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-sm">
      <div class="space-y-1">
        <h1 class="text-2xl font-black text-slate-900 tracking-tight flex items-center gap-2.5">
          <span class="material-symbols-outlined text-amber-500 text-3xl">campaign</span>
          Publicar Comunicado en la Pantalla de Inasistencias
        </h1>
        <p class="text-sm text-slate-500">
          Gestión de avisos para el personal administrativo y cuerpo de adscriptos. Los comunicados aparecerán de inmediato en la <strong>Pantalla de Inasistencias</strong> del pasillo.
        </p>
      </div>

      <div class="flex items-center gap-2 self-start md:self-auto flex-wrap">
        <a href="https://docs.google.com/spreadsheets/d/1t83h87_A01gSG518nU7QtpCGMNHR7kRbB900l-18TIk/edit?usp=sharing" target="_blank" rel="noopener noreferrer" class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-sm transition-colors" title="Abrir Google Sheets para redactar o editar avisos en la pestaña Avisos">
          <span class="material-symbols-outlined text-base">post_add</span>
          <span>Pestaña Avisos en Google Sheets</span>
          <span class="material-symbols-outlined text-xs">open_in_new</span>
        </a>
        <a href="https://docs.google.com/spreadsheets/d/1t83h87_A01gSG518nU7QtpCGMNHR7kRbB900l-18TIk/edit?usp=sharing" target="_blank" rel="noopener noreferrer" class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs border border-slate-300 transition-colors">
          <span class="material-symbols-outlined text-base text-slate-500">table_chart</span>
          <span>Planilla Completa</span>
          <span class="material-symbols-outlined text-xs">open_in_new</span>
        </a>
      </div>
    </div>



    <!-- Grid de 2 Columnas -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      
      <!-- ===================================================================== -->
      <!-- ===================================================================== -->
      <!-- COLUMNA IZQUIERDA: FORMULARIO DE INGRESO / EDICIÓN (7 Columnas)       -->
      <!-- ===================================================================== -->
      <section class="lg:col-span-7 bg-white rounded-2xl p-6 sm:p-8 border-2 border-slate-200 shadow-sm">
        <div class="flex items-center justify-between pb-5 mb-6 border-b border-slate-200">
          <div class="flex items-center gap-3">
            <div id="form-icon-container" class="h-10 w-10 rounded-xl bg-sky-100 text-sky-800 flex items-center justify-center font-bold shrink-0 transition-colors">
              <span class="material-symbols-outlined text-2xl" id="form-icon">edit_note</span>
            </div>
            <div>
              <div class="flex items-center gap-2">
                <h2 class="text-lg font-black text-slate-900" id="form-titulo">Detalles del Comunicado</h2>
                <span id="badge-modo-edicion" class="hidden px-2 py-0.5 rounded text-[10px] font-black uppercase tracking-wider bg-amber-100 text-amber-800 border border-amber-300">Modo Edición</span>
              </div>
              <p class="text-xs text-slate-500" id="form-subtitulo">Completa los campos para proyectar en el monitor del hall</p>
            </div>
          </div>
        </div>

        <form id="form-aviso" class="space-y-6">
          <!-- Campo oculto para ID de aviso al editar -->
          <input type="hidden" id="aviso-id" value="">

          <!-- 1. Título -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label for="aviso-titulo" class="block text-xs font-bold uppercase tracking-wider text-slate-700">
                Título del Comunicado <span class="text-red-500">*</span>
              </label>
              <span id="contador-titulo" class="text-[11px] text-slate-500 font-mono font-bold">0 / 65</span>
            </div>
            <input type="text" id="aviso-titulo" required maxlength="65" placeholder="Ej: Jornada de Elección de Horas / Inscripciones a Exámenes..." class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 text-sm font-medium focus:border-sky-500 focus:outline-none transition-colors text-slate-900 bg-slate-50/50">
          </div>

          <!-- 2. Categoría Oficial del Comunicado (6 Categorías Institucionales) -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">
              Categoría y Nivel Visual del Comunicado <span class="text-slate-400 font-normal lowercase">(selecciona 1 de 6)</span>
            </label>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5 text-xs">
              
              <!-- 1. Urgente (Rojo) -->
              <label class="flex items-center gap-2.5 p-3 rounded-xl border-2 border-slate-200 cursor-pointer hover:bg-slate-50 transition-all has-[:checked]:border-red-500 has-[:checked]:bg-red-50/70">
                <input type="radio" name="prioridad" value="urgente" class="text-red-600 accent-red-600 w-4 h-4 shrink-0">
                <div class="flex items-center gap-1.5 min-w-0">
                  <span class="font-bold text-red-800">🔴 Urgente</span>
                  <span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-red-200 text-red-900 uppercase">Rojo</span>
                </div>
              </label>

              <!-- 2. Atención (Naranja) -->
              <label class="flex items-center gap-2.5 p-3 rounded-xl border-2 border-slate-200 cursor-pointer hover:bg-slate-50 transition-all has-[:checked]:border-amber-500 has-[:checked]:bg-amber-50/70">
                <input type="radio" name="prioridad" value="atencion" checked class="text-amber-500 accent-amber-500 w-4 h-4 shrink-0">
                <div class="flex items-center gap-1.5 min-w-0">
                  <span class="font-bold text-amber-800">🟠 Atención</span>
                  <span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-amber-200 text-amber-900 uppercase">Naranja</span>
                </div>
              </label>

              <!-- 3. Avisos (Púrpura) -->
              <label class="flex items-center gap-2.5 p-3 rounded-xl border-2 border-slate-200 cursor-pointer hover:bg-slate-50 transition-all has-[:checked]:border-purple-500 has-[:checked]:bg-purple-50/70">
                <input type="radio" name="prioridad" value="avisos" class="text-purple-600 accent-purple-600 w-4 h-4 shrink-0">
                <div class="flex items-center gap-1.5 min-w-0">
                  <span class="font-bold text-purple-800">🟣 Avisos</span>
                  <span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-purple-200 text-purple-900 uppercase">Púrpura</span>
                </div>
              </label>

              <!-- 4. Información (Azul) -->
              <label class="flex items-center gap-2.5 p-3 rounded-xl border-2 border-slate-200 cursor-pointer hover:bg-slate-50 transition-all has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50/70">
                <input type="radio" name="prioridad" value="informacion" class="text-blue-600 accent-blue-600 w-4 h-4 shrink-0">
                <div class="flex items-center gap-1.5 min-w-0">
                  <span class="font-bold text-blue-800">🔵 Información</span>
                  <span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-blue-200 text-blue-900 uppercase">Azul</span>
                </div>
              </label>

              <!-- 5. Trámites (Verde) -->
              <label class="flex items-center gap-2.5 p-3 rounded-xl border-2 border-slate-200 cursor-pointer hover:bg-slate-50 transition-all has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-50/70">
                <input type="radio" name="prioridad" value="tramites" class="text-emerald-600 accent-emerald-600 w-4 h-4 shrink-0">
                <div class="flex items-center gap-1.5 min-w-0">
                  <span class="font-bold text-emerald-800">🟢 Trámites</span>
                  <span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-emerald-200 text-emerald-900 uppercase">Verde</span>
                </div>
              </label>

              <!-- 6. Exámenes (Amarillo) -->
              <label class="flex items-center gap-2.5 p-3 rounded-xl border-2 border-slate-200 cursor-pointer hover:bg-slate-50 transition-all has-[:checked]:border-amber-400 has-[:checked]:bg-amber-50/80">
                <input type="radio" name="prioridad" value="examenes" class="text-amber-500 accent-amber-500 w-4 h-4 shrink-0">
                <div class="flex items-center gap-1.5 min-w-0">
                  <span class="font-bold text-amber-900">🟡 Exámenes</span>
                  <span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-amber-200 text-amber-950 uppercase">Amarillo</span>
                </div>
              </label>

            </div>
          </div>

          <!-- 3. Mensaje -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label for="aviso-mensaje" class="block text-xs font-bold uppercase tracking-wider text-slate-700">
                Mensaje Detallado <span class="text-red-500">*</span>
              </label>
              <span id="contador-mensaje" class="text-[11px] text-slate-500 font-mono font-bold">0 caracteres</span>
            </div>
            <textarea id="aviso-mensaje" required rows="4" placeholder="Escribe el cuerpo del comunicado con información concisa y clara para los estudiantes..." class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 text-sm font-medium focus:border-sky-500 focus:outline-none transition-colors text-slate-900 bg-slate-50/50 resize-y"></textarea>
          </div>

          <!-- 4. Toggle y Enlace para Generación Automática de Código QR -->
          <div class="p-4 rounded-xl bg-slate-50 border-2 border-slate-200 space-y-3">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <span class="material-symbols-outlined text-slate-600 text-xl">qr_code_2</span>
                <div>
                  <label for="aviso-toggle-qr" class="text-xs font-bold text-slate-800 cursor-pointer block">¿Incluir Código QR para celular?</label>
                  <p class="text-[11px] text-slate-500">El código se genera automáticamente a partir del enlace que ingreses</p>
                </div>
              </div>
              <input type="checkbox" id="aviso-toggle-qr" class="w-5 h-5 rounded text-sky-600 accent-sky-600 cursor-pointer">
            </div>

            <!-- Contenedor de Enlace Web de Destino y Previsualización del QR generado -->
            <div id="contenedor-qr-enlace" class="hidden pt-3 border-t border-slate-200 space-y-3">
              <div>
                <div class="flex items-center justify-between mb-1.5">
                  <label for="aviso-qr-url" class="block text-[11px] font-bold uppercase text-slate-700">
                    Enlace Web de Destino (URL) <span class="text-red-500">*</span>
                  </label>
                  <span class="text-[10px] font-semibold text-emerald-700 flex items-center gap-1">
                    <span class="material-symbols-outlined text-xs">auto_awesome</span> Generación automática instantánea
                  </span>
                </div>
                <div class="relative">
                  <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">link</span>
                  <input type="url" id="aviso-qr-url" placeholder="https://utu.edu.uy/tramites/inscripciones" class="w-full pl-9 pr-4 py-2.5 rounded-xl border-2 border-slate-200 text-xs sm:text-sm font-medium focus:border-sky-500 focus:outline-none transition-colors text-slate-900 bg-white">
                </div>
                <p class="text-[11px] text-slate-500 mt-1">
                  Escribe o pega la dirección web completa. El QR se dibuja automáticamente en alta resolución y alto contraste para ser legible a distancia desde un celular apuntando a la TV.
                </p>
              </div>

              <!-- Vista previa compacta del QR autogenerado dentro del formulario -->
              <div id="qr-preview-box" class="hidden bg-white border-2 border-slate-200 rounded-xl p-3 flex items-center justify-between gap-3 shadow-sm">
                <div class="flex items-center gap-3 min-w-0">
                  <div class="h-16 w-16 bg-white rounded-lg border-2 border-slate-900 p-1 shrink-0 flex items-center justify-center overflow-hidden shadow-sm">
                    <img id="qr-preview-img" src="" alt="Vista previa QR generado" class="w-full h-full object-contain">
                  </div>
                  <div class="min-w-0">
                    <span class="text-xs font-black text-slate-800 block truncate">Código QR Generado con Éxito</span>
                    <span class="text-[11px] text-emerald-600 font-bold flex items-center gap-1 mt-0.5">
                      <span class="material-symbols-outlined text-xs">check_circle</span> Listo para escaneo desde celular en TV
                    </span>
                    <span id="qr-preview-url-text" class="text-[10px] text-sky-800 font-mono block mt-0.5 truncate font-semibold"></span>
                  </div>
                </div>
                <button type="button" id="btn-limpiar-qr-url" class="px-2.5 py-1.5 rounded-lg text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 transition-colors cursor-pointer shrink-0" title="Limpiar enlace">
                  Limpiar
                </button>
              </div>
            </div>
          </div>

          <!-- Botones de Acción: Publicar / Guardar, Eliminar y Cancelar -->
          <div class="pt-2 flex items-center gap-2.5 flex-wrap">
            <button type="submit" id="btn-submit-aviso" class="flex-1 min-w-[200px] py-3.5 px-6 rounded-xl bg-[#00489A] hover:bg-[#003878] text-white font-extrabold text-sm shadow-md transition-all flex items-center justify-center gap-2 cursor-pointer">
              <span class="material-symbols-outlined text-xl" id="btn-submit-icon">send</span>
              <span id="btn-submit-texto">Publicar Aviso en Pantalla TV</span>
            </button>
            <button type="button" id="btn-eliminar-form" class="hidden py-3.5 px-4 rounded-xl bg-red-50 hover:bg-red-100 text-red-700 font-bold text-sm border-2 border-red-200 transition-all flex items-center justify-center gap-1.5 cursor-pointer" title="Eliminar este comunicado de la cartelera y de Google Sheets">
              <span class="material-symbols-outlined text-lg">delete</span>
              <span>Eliminar</span>
            </button>
            <button type="button" id="btn-cancelar-edicion" class="hidden py-3.5 px-4 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm border-2 border-slate-300 transition-all flex items-center justify-center gap-1.5 cursor-pointer">
              <span class="material-symbols-outlined text-lg">close</span>
              <span>Cancelar</span>
            </button>
          </div>

        </form>
      </section>

      <!-- ===================================================================== -->
      <!-- COLUMNA DERECHA: VISTA PREVIA + AVISOS ACTIVOS (5 Columnas)           -->
      <!-- ===================================================================== -->
      <div class="lg:col-span-5 space-y-6">
        
        <!-- Tarjeta 1: Vista Previa en Vivo (Simulador de TV) -->
        <div class="bg-white rounded-2xl p-6 border-2 border-slate-200 shadow-sm">
          <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-200">
            <div class="flex items-center gap-2">
              <span class="material-symbols-outlined text-sky-600 text-xl">visibility</span>
              <h3 class="text-sm font-extrabold uppercase tracking-wide text-slate-800">Vista Previa en Tiempo Real</h3>
            </div>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600 border border-slate-200">Simulador TV</span>
          </div>

          <!-- Contenedor donde se dibuja la tarjeta reactivamente -->
          <div id="preview-card-container">
            <!-- Renderizado dinámico desde avisos-admin.js -->
          </div>
        </div>

        <!-- Tarjeta 2: Avisos Gestionables en Cartelera -->
        <div class="bg-white rounded-2xl p-6 border-2 border-slate-200 shadow-sm">
          <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-200 gap-2">
            <div class="flex items-center gap-2 min-w-0">
              <span class="material-symbols-outlined text-amber-500 text-xl shrink-0">fact_check</span>
              <h3 class="text-sm font-extrabold uppercase tracking-wide text-slate-800 truncate">Avisos en Cartelera Digital</h3>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <span class="text-xs font-black px-2 py-0.5 rounded-full bg-sky-100 text-sky-800" id="contador-avisos-activos">0</span>
            </div>
          </div>

          <!-- Barra de Búsqueda y Filtros Rápidos -->
          <div class="space-y-2.5 mb-4">
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">search</span>
              <input type="text" id="busqueda-avisos" placeholder="Buscar por título o contenido..." class="w-full pl-8 pr-8 py-2 rounded-xl border-2 border-slate-200 text-xs font-medium focus:border-sky-500 focus:outline-none text-slate-800 bg-slate-50/70 transition-colors">
              <button type="button" id="btn-limpiar-busqueda" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 cursor-pointer">
                <span class="material-symbols-outlined text-sm">cancel</span>
              </button>
            </div>

            <!-- Filtros y Herramientas -->
            <div class="flex items-center justify-between gap-2 flex-wrap pt-1">
              <div class="flex items-center gap-1 text-[11px]" id="filtros-estado-container">
                <button type="button" class="filtro-btn px-2.5 py-1 rounded-lg font-bold bg-[#00489A] text-white shadow-xs cursor-pointer transition-colors" data-filtro="todos">Todos</button>
                <button type="button" class="filtro-btn px-2.5 py-1 rounded-lg font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 cursor-pointer transition-colors" data-filtro="activos">En TV</button>
                <button type="button" class="filtro-btn px-2.5 py-1 rounded-lg font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 cursor-pointer transition-colors" data-filtro="pausados">En Pausa</button>
              </div>

              <!-- Herramientas de Limpieza -->
              <div class="flex items-center gap-1.5">
                <button type="button" id="btn-restaurar-base" class="p-1 rounded-lg text-slate-500 hover:text-red-700 hover:bg-red-50 border border-slate-200 transition-colors cursor-pointer" title="Vaciar todos los comunicados">
                  <span class="material-symbols-outlined text-sm">delete_sweep</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Listado de avisos con botón de editar, conmutar y eliminar -->
          <div class="space-y-3" id="lista-avisos-activos">
            <!-- Renderizado dinámico desde avisos-admin.js -->
          </div>
        </div>

      </div>

    </div>
  </main>

      <div class="flex items-center gap-3.5 mb-4">
