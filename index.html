<!DOCTYPE html>
<html class="h-full bg-slate-100" lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantalla de Inasistencias - ISBO</title>
  <link rel="icon" type="image/jpeg" href="logo-isbo.jpg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00489A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Iconos Material y Fuente Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- Estilos propios mínimos (animaciones de marquesina) -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col font-sans bg-[#F1F5F9] text-slate-800 antialiased">

  <!-- ========================================================================= -->
  <!-- 1. ENCABEZADO SUPERIOR: Logo Oficial ISBO, Fecha y Reloj                  -->
  <!-- ========================================================================= -->
  <header class="bg-[#00489A] text-white border-b-2 border-[#F8E124] shadow-md shrink-0 z-30">
    <div class="w-full px-5 py-2 flex items-center justify-between gap-4">
      <!-- Identificación Institucional: Pantalla de Inasistencias -->
      <div class="flex items-center gap-2.5 shrink-0">
        <img src="logo-isbo.jpg" alt="Logo ISBO" class="h-9 w-9 rounded-lg object-contain shadow-sm border border-white/20 bg-[#00489A]">
        <div>
          <span class="text-lg sm:text-xl font-black tracking-tight text-white block leading-tight">Pantalla de Inasistencias</span>
          <p class="text-[11px] text-sky-100 font-medium truncate">ISBO · Instituto Superior Brazo Oriental</p>
        </div>
      </div>

      <!-- Fecha Oficial y Reloj Digital (Colores oficiales del logo) -->
      <div class="flex-1 flex items-center justify-center px-2">
        <div class="flex items-center gap-3.5 bg-black/15 px-4 py-1 rounded-xl border border-white/20 shadow-inner backdrop-blur-md">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-[#F8E124] text-2xl">calendar_today</span>
            <div class="text-left">
              <span class="block text-[9px] font-black uppercase tracking-widest text-[#F8E124] leading-none">Fecha de hoy</span>
              <h1 class="text-xl sm:text-2xl font-black text-white tracking-wide capitalize mt-0.5 leading-none" id="reloj-fecha">Cargando fecha...</h1>
            </div>
          </div>
          <div class="h-6 w-px bg-white/20"></div>
          <div class="flex items-center gap-1.5 px-2.5 py-0.5 rounded-lg bg-black/25 border border-white/10">
            <span class="material-symbols-outlined text-sky-200 text-sm">schedule</span>
            <div class="text-xs sm:text-sm font-bold font-mono tracking-tight text-white leading-none" id="reloj-hora">--:--:--</div>
          </div>
        </div>
      </div>

      <!-- Acciones: Pantalla Completa (Solo Icono) -->
      <div class="flex items-center gap-2.5 shrink-0">
        <button id="btn-fullscreen" class="p-2 rounded-xl bg-white/10 hover:bg-white/20 active:scale-95 text-white transition-all border border-white/15 cursor-pointer shadow-sm flex items-center justify-center" title="Pantalla Completa (F11)" aria-label="Pantalla Completa (F11)">
          <span class="material-symbols-outlined text-xl">fullscreen</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ========================================================================= -->
  <!-- 2. CONTENIDO PRINCIPAL: Inasistencias de Hoy (68%) y Avisos con Marquee (32%) -->
  <!-- ========================================================================= -->
  <main class="flex-1 w-full p-3.5 sm:p-4 overflow-hidden grid grid-cols-12 gap-3.5 sm:gap-4 items-stretch min-h-0">
    <!-- COLUMNA IZQUIERDA: Inasistencias -->
    <section class="col-span-12 lg:col-span-8 flex flex-col h-full bg-white rounded-2xl shadow-lg border-2 border-slate-200/90 overflow-hidden">
      <!-- Encabezado Compacto: Inasistencias -->
      <div class="px-5 py-2.5 bg-gradient-to-r from-red-600 via-rose-600 to-red-700 text-white shrink-0 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-2.5">
          <div class="h-7 w-7 rounded-lg bg-white/20 backdrop-blur-sm flex items-center justify-center shrink-0 border border-white/30">
            <span class="material-symbols-outlined text-white text-lg">person_cancel</span>
          </div>
          <h2 class="text-base sm:text-lg font-black tracking-wide uppercase leading-none">Inasistencias</h2>
        </div>
        <div class="flex items-center gap-1.5 bg-white/20 px-2.5 py-1 rounded-lg border border-white/30 shrink-0">
          <span class="text-base font-black text-white leading-none" id="contador-docentes">0</span>
          <span class="text-[11px] font-bold uppercase tracking-wider text-white">Docentes</span>
        </div>
      </div>

      <!-- Cabecera de Columnas -->
      <div class="px-6 py-2.5 bg-slate-100/90 border-b border-slate-200 grid grid-cols-12 text-xs font-extrabold uppercase tracking-wider text-slate-600 shrink-0">
        <div class="col-span-5">Profesor / Docente</div>
        <div class="col-span-4">Grupo(s) Afectado(s)</div>
        <div class="col-span-3 text-right">Duración / Detalle</div>
      </div>

      <!-- Contenedor con lista de docentes y desplazamiento continuo -->
      <div class="flex-1 overflow-hidden relative p-4 bg-slate-50/60" id="contenedor-scroll-docentes">
        <div class="space-y-3.5" id="lista-docentes">
          <!-- Tarjetas generadas dinámicamente -->
        </div>
      </div>
    </section>

    <!-- COLUMNA DERECHA: Solo los Avisos con Marquesina Vertical (Sin Header de Panel) -->
    <aside class="col-span-12 lg:col-span-4 flex flex-col h-full overflow-hidden">
      <!-- Lista de avisos institucionales con MARQUESINA VERTICAL continua -->
      <div class="flex-1 overflow-hidden relative min-h-0" id="contenedor-scroll-avisos">
        <div class="space-y-4" id="contenedor-avisos">
          <!-- Tarjetas generadas dinámicamente con marquesina -->
        </div>
      </div>
    </aside>
  </main>



  <!-- ========================================================================= -->
  <!-- 4. SCRIPTS MODULARIZADOS VANILLA                                          -->
  <script src="js/qrcode.min.js"></script>
  <script src="js/sheet.js?v=3.4"></script>
  <script src="js/inasistencias.js?v=3.4"></script>
  <script src="js/ui.js?v=3.4"></script>
  <script src="js/app.js?v=3.4"></script>

</body>
</html>
